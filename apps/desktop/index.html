<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" type="image/png" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/apple-touch-icon.png" />
    <title>Hermes</title>
    <script>
      // Pre-paint the themed background before the app bundle loads. Without
      // this, the first frame (which is what `ready-to-show` waits for) is the
      // UA-default white page, and the real theme only lands once the whole
      // module graph has executed — i.e. the "white flash" on every new
      // window. applyTheme() in src/themes/context.tsx keeps these keys fresh.
      // Read one cached key. Storage can be unavailable outright (private
      // mode, quota, a data: URL) and there the ACCESSOR itself throws, so
      // each read is guarded separately. Wrapping the whole block in one
      // try/catch instead means the first failed read skips the paint too,
      // and the window comes up UA-default white: the exact flash this
      // script exists to prevent, in the one case it most needs to work.
      function bootKey(name) {
        try {
          return localStorage.getItem(name)
        } catch {
          return null
        }
      }

      // OPAQUE WINDOWS ONLY. The `?win=` kinds Electron creates with
      // `transparent: true` already have a clear canvas, and pre-painting a
      // theme colour there does not prevent a flash, it IS the flash: an
      // opaque rectangle standing until that window's module graph executes.
      // On the full-screen intro cinematic, over the real desktop, on a dev
      // server that serves the graph unbundled, that read as seconds of white.
      // The list is TRANSPARENT_WINDOWS in src/main.tsx, keep the two in step.
      // `secondary` (a session window) and `browser` are opaque and DO want
      // the pre-paint.
      function bootWindowIsTransparent() {
        try {
          var win = new URLSearchParams(window.location.search).get('win')
          return Boolean(win) && ['hud', 'overlay', 'quick', 'wake', 'intro'].indexOf(win) !== -1
        } catch {
          return false
        }
      }

      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
      var bg = bootKey('hermes-boot-background')
      var scheme = bootKey('hermes-boot-color-scheme')
      if (!bg) {
        bg = prefersDark ? '#111111' : '#f7f7f7'
      }

      // Is the surface we are ACTUALLY about to paint dark? Ask the colour,
      // not the scheme key. The three cached keys are written together but
      // read independently, and a store holding the background without the
      // scheme is a real state (observed on this machine) — deciding the ink
      // from the scheme there picks the light branch over a dark background
      // and renders near-black on near-black, which looks like a window that
      // failed to paint. `chromeBackground()` in themes/context.tsx emits
      // hex, so luminance is available right here; anything unparseable
      // falls back to the OS preference.
      function surfaceIsDark(color) {
        var hex = String(color).trim()
        if (hex.charAt(0) !== '#') {
          return prefersDark
        }
        hex = hex.slice(1)
        if (hex.length === 3) {
          hex = hex.charAt(0) + hex.charAt(0) + hex.charAt(1) + hex.charAt(1) + hex.charAt(2) + hex.charAt(2)
        }
        if (!/^[0-9a-fA-F]{6}$/.test(hex)) {
          return prefersDark
        }
        var n = parseInt(hex, 16)
        // Rec. 601 luma, which is close enough to pick an ink.
        var luma = (((n >> 16) & 255) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 255000
        return luma < 0.5
      }

      var isDark = surfaceIsDark(bg)
      if (scheme !== 'dark' && scheme !== 'light') {
        scheme = isDark ? 'dark' : 'light'
      }
      var root = document.documentElement
      if (!bootWindowIsTransparent()) {
        root.style.backgroundColor = bg
        root.style.colorScheme = scheme
      }
      // The boot screen paints before styles.css exists, so it cannot use the
      // --ui-chat-surface-background token the React overlay fills with. Hand
      // it the same colour directly.
      root.style.setProperty('--boot-surface', bg)
      // Ink for the CONNECTING text: the theme's own accent once the app has
      // run here before, otherwise a neutral legible against THIS surface.
      root.style.setProperty(
        '--boot-ink',
        bootKey('hermes-boot-primary') || (isDark ? '#d4d4d4' : '#3f3f3f')
      )
    </script>
    <style>
      /* Boot screen — see the #boot-connecting markup below. Inline because a
         stylesheet link would be one more thing to fetch before it can paint. */
      #boot-connecting {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        /* --boot-surface is set by the script above from the same cached
           value the React overlay's --ui-chat-surface-background resolves to,
           because that token does not exist until styles.css has loaded. */
        background: var(--boot-surface, #111111);
      }
      #boot-connecting b {
        padding-left: 0.4em;
        font: 600 0.64rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        font-variant-numeric: tabular-nums;
        display: inline-flex;
        align-items: center;
        color: var(--boot-ink, #808080);
      }
      /* The trailing cursor square from <DecodeText cursor>. */
      #boot-connecting i {
        margin-left: 0.125rem;
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 1px;
        transform: translateY(-1px);
        background: currentcolor;
      }
    </style>
  </head>
  <body>
    <div id="root" class="scrollbar-dt">
      <!--
        Boot screen, painted before the app bundle exists.

        The renderer's entry graph is ~5.4 MB across ~107 modules; fetching,
        compiling and evaluating it took ~1.8 s on the reference machine, and
        for all of it the window was mapped and EMPTY — the pre-paint script
        above only sets a background colour, so the user watched a blank
        rectangle and reasonably concluded nothing had happened.

        This is deliberately not a new screen. It is the same CONNECTING
        surface <GatewayConnectingOverlay> renders a moment later (same
        background token, same mono/uppercase/0.4em type, same 4-character
        legible prefix and cursor square), so React taking over is a
        handoff rather than a transition. Keep the two in step.

        It lives INSIDE #root on purpose: createRoot() clears its container on
        the first commit, so there is no teardown to get wrong.
      -->
      <div aria-hidden="true" data-glass-opaque="" id="boot-connecting">
        <b id="boot-connecting-text"
          >CONN<span id="boot-connecting-tail">//////</span><i></i
        ></b>
      </div>
    </div>
    <script>
      // Scramble the tail so the boot screen reads as working rather than
      // hung. Same charset and same 4-character legible prefix as
      // <DecodeText>. Stops on its own once React clears #root, so nothing
      // has to remember to cancel it.
      ;(function () {
        try {
          var tail = document.getElementById('boot-connecting-tail')
          if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            return
          }
          var chars = '/\\|-_=+<>~:*'
          var id = setInterval(function () {
            if (!tail.isConnected) {
              clearInterval(id)
              return
            }
            var out = ''
            for (var i = 0; i < 6; i++) {
              out += chars[(Math.random() * chars.length) | 0]
            }
            tail.textContent = out
          }, 70)
        } catch {
          // Any failure here just leaves the static boot screen up.
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
